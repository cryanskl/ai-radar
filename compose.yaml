services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_radar
      POSTGRES_USER: ai_radar
      POSTGRES_PASSWORD: ai_radar
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_radar -d ai_radar"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - ai-radar-postgres:/var/lib/postgresql/data

volumes:
  ai-radar-postgres:
